server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mastodon_rails
    static_configs:
      - targets:
          - localhost
        labels:
          job: mastodon
          service: rails
          __path__: /var/log/mastodon/production.log

  - job_name: mastodon_sidekiq
    static_configs:
      - targets:
          - localhost
        labels:
          job: mastodon
          service: sidekiq
          __path__: /var/log/mastodon/sidekiq.log

  - job_name: mastodon_systemd
    journal:
      max_age: 168h
      labels:
        job: mastodon
        service: systemd
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
      - source_labels: [__journal__systemd_unit]
        regex: mastodon-.+\.service
        action: keep
